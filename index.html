<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cute Creature Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        
        /* Glassmorphism */
        .glass { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-strong { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.4); }
        
        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounce-in { 0% { transform: scale(1); } 30% { transform: scale(0.85); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
        @keyframes glow-pulse { 0%, 100% { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; } 50% { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor; } }
        @keyframes particle-drift { 0% { transform: translateY(0) translateX(0) scale(1); opacity: 1; } 100% { transform: translateY(-80px) translateX(30px) scale(0); opacity: 0; } }
        @keyframes pedestal-glow { 0%, 100% { box-shadow: 0 0 30px rgba(167, 139, 250, 0.3), 0 0 60px rgba(167, 139, 250, 0.1); } 50% { box-shadow: 0 0 50px rgba(167, 139, 250, 0.5), 0 0 100px rgba(167, 139, 250, 0.2); } }
        @keyframes hatch-shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
        @keyframes reveal { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 50% { transform: scale(1.3) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        
        .float-anim { animation: float 3s ease-in-out infinite; }
        .spin-slow { animation: spin-slow 20s linear infinite; }
        .bounce-click { animation: bounce-in 0.5s ease-out; }
        .glow-text { animation: glow-pulse 2s ease-in-out infinite; }
        .pedestal-glow { animation: pedestal-glow 3s ease-in-out infinite; }
        .hatch-shake { animation: hatch-shake 0.3s ease-in-out infinite; }
        .reveal-anim { animation: reveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        
        /* Background gradient */
        .bg-pastel { background: linear-gradient(135deg, #c7d2fe 0%, #e0e7ff 25%, #ddd6fe 50%, #c4b5fd 75%, #a5b4fc 100%); }
        
        /* Nav active indicator */
        .nav-active { background: linear-gradient(135deg, #8b5cf6, #6366f1); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        
        /* Scrollbar hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-pastel">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ============ RARITY SYSTEM ============
        const CREATURES = {
            common: {
                id: 'green_slime',
                name: 'Green Slime',
                rarity: 'Common',
                chance: 70,
                image: './images/image_0.png',
                textColor: 'text-green-400',
                glowColor: '#4ade80',
                bgGradient: 'from-green-400/20 to-emerald-400/20',
            },
            rare: {
                id: 'blue_fox',
                name: 'Blue Fox',
                rarity: 'Rare',
                chance: 18,
                image: null, // Placeholder
                textColor: 'text-blue-400',
                glowColor: '#60a5fa',
                bgGradient: 'from-blue-400/20 to-cyan-400/20',
            },
            epic: {
                id: 'fire_phoenix',
                name: 'Fire Phoenix',
                rarity: 'Epic',
                chance: 10,
                image: null, // Placeholder
                textColor: 'text-purple-400',
                glowColor: '#c084fc',
                bgGradient: 'from-purple-400/20 to-pink-400/20',
            },
            legendary: {
                id: 'crystal_dragon',
                name: 'Purple Crystalline Dragon',
                rarity: 'Legendary',
                chance: 2,
                image: './images/image_1.png',
                textColor: 'text-yellow-400',
                glowColor: '#fbbf24',
                bgGradient: 'from-yellow-400/20 to-amber-400/20',
            },
        };

        function rollCreature() {
            const roll = Math.random() * 100;
            if (roll < 2) return CREATURES.legendary;
            if (roll < 12) return CREATURES.epic;
            if (roll < 30) return CREATURES.rare;
            return CREATURES.common;
        }

        // ============ MAIN APP ============
        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [coins, setCoins] = useState(1000);
            const [energy, setEnergy] = useState(50);
            const [maxEnergy] = useState(50);
            const [level, setLevel] = useState(1);
            const [currentCreature, setCurrentCreature] = useState(CREATURES.common);
            const [isHatching, setIsHatching] = useState(false);
            const [showReveal, setShowReveal] = useState(false);
            const [isBouncing, setIsBouncing] = useState(false);
            const [collection, setCollection] = useState([]);

            const handlePedestalClick = () => {
                if (isBouncing || isHatching) return;
                
                setIsBouncing(true);
                setTimeout(() => setIsBouncing(false), 500);

                // Spend energy to hatch
                if (energy >= 5) {
                    setEnergy(prev => prev - 5);
                    setIsHatching(true);
                    
                    setTimeout(() => {
                        const newCreature = rollCreature();
                        setCurrentCreature(newCreature);
                        setIsHatching(false);
                        setShowReveal(true);
                        setCoins(prev => prev + (newCreature.rarity === 'Legendary' ? 500 : newCreature.rarity === 'Epic' ? 100 : newCreature.rarity === 'Rare' ? 50 : 10));
                        
                        // Add to collection
                        setCollection(prev => [...prev, { ...newCreature, timestamp: Date.now() }]);
                        
                        setTimeout(() => setShowReveal(false), 2000);
                    }, 2000);
                }
            };

            return (
                <div className="h-screen w-screen flex flex-col overflow-hidden relative">
                    {/* Floating particles background */}
                    <FloatingParticles />
                    
                    {/* Header Stats */}
                    <Header level={level} coins={coins} energy={energy} maxEnergy={maxEnergy} />
                    
                    {/* Main Content */}
                    <div className="flex-1 flex flex-col items-center justify-center relative px-4 no-scrollbar overflow-hidden">
                        {activeTab === 'home' && (
                            <HomeScreen 
                                currentCreature={currentCreature}
                                isHatching={isHatching}
                                showReveal={showReveal}
                                isBouncing={isBouncing}
                                onPedestalClick={handlePedestalClick}
                                energy={energy}
                            />
                        )}
                        {activeTab === 'tasks' && <TasksScreen coins={coins} setCoins={setCoins} />}
                        {activeTab === 'collection' && <CollectionScreen collection={collection} />}
                        {activeTab === 'wallet' && <WalletScreen coins={coins} />}
                    </div>
                    
                    {/* Bottom Navigation */}
                    <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
                </div>
            );
        }

        // ============ FLOATING PARTICLES ============
        function FloatingParticles() {
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                    {[...Array(8)].map((_, i) => (
                        <div
                            key={i}
                            className="absolute rounded-full opacity-30"
                            style={{
                                width: `${Math.random() * 60 + 20}px`,
                                height: `${Math.random() * 60 + 20}px`,
                                left: `${Math.random() * 100}%`,
                                top: `${Math.random() * 100}%`,
                                background: `radial-gradient(circle, ${['#c4b5fd', '#a5b4fc', '#93c5fd', '#c084fc'][i % 4]}, transparent)`,
                                animation: `float ${3 + Math.random() * 4}s ease-in-out infinite`,
                                animationDelay: `${Math.random() * 2}s`,
                            }}
                        />
                    ))}
                </div>
            );
        }

        // ============ HEADER ============
        function Header({ level, coins, energy, maxEnergy }) {
            return (
                <div className="relative z-10 px-4 pt-3 pb-2">
                    <div className="glass-strong rounded-2xl px-4 py-3 flex items-center justify-between">
                        {/* Level */}
                        <div className="flex items-center gap-1.5">
                            <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center shadow-lg">
                                <span className="text-white text-xs font-bold">⚡</span>
                            </div>
                            <div>
                                <p className="text-[10px] text-purple-300 font-medium">Level</p>
                                <p className="text-sm font-bold text-white font-poppins">{level}</p>
                            </div>
                        </div>
                        
                        {/* Coins */}
                        <div className="flex items-center gap-1.5">
                            <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-yellow-400 to-amber-500 flex items-center justify-center shadow-lg">
                                <span className="text-white text-xs">🪙</span>
                            </div>
                            <div>
                                <p className="text-[10px] text-purple-300 font-medium">Coins</p>
                                <p className="text-sm font-bold text-white font-poppins">{coins.toLocaleString()}</p>
                            </div>
                        </div>
                        
                        {/* Energy */}
                        <div className="flex items-center gap-1.5">
                            <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-400 to-cyan-500 flex items-center justify-center shadow-lg">
                                <span className="text-white text-xs">⚡</span>
                            </div>
                            <div>
                                <p className="text-[10px] text-purple-300 font-medium">Energy</p>
                                <p className="text-sm font-bold text-white font-poppins">{energy}/{maxEnergy}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============ HOME SCREEN ============
        function HomeScreen({ currentCreature, isHatching, showReveal, isBouncing, onPedestalClick, energy }) {
            return (
                <div className="flex flex-col items-center justify-center gap-4 w-full">
                    {/* Creature Name Label */}
                    <div className="text-center">
                        {isHatching ? (
                            <p className="text-lg font-bold font-poppins text-amber-300 glow-text" style={{ color: '#fbbf24' }}>
                                Hatching...
                            </p>
                        ) : (
                            <div>
                                <p 
                                    className={`text-lg font-bold font-poppins glow-text ${currentCreature.textColor}`}
                                    style={{ color: currentCreature.glowColor }}
                                >
                                    {currentCreature.name}
                                </p>
                                <p 
                                    className={`text-xs font-semibold mt-1 px-3 py-0.5 rounded-full inline-block ${
                                        currentCreature.rarity === 'Legendary' ? 'bg-yellow-400/20 text-yellow-300' :
                                        currentCreature.rarity === 'Epic' ? 'bg-purple-400/20 text-purple-300' :
                                        currentCreature.rarity === 'Rare' ? 'bg-blue-400/20 text-blue-300' :
                                        'bg-green-400/20 text-green-300'
                                    }`}
                                >
                                    {currentCreature.rarity === 'Legendary' ? '★ ' : ''}{currentCreature.rarity}
                                </p>
                            </div>
                        )}
                    </div>

                    {/* Glass Pedestal */}
                    <div 
                        className={`relative cursor-pointer select-none ${isBouncing ? 'bounce-click' : ''}`}
                        onClick={onPedestalClick}
                    >
                        {/* Outer glow ring */}
                        <div className="absolute inset-0 rounded-full pedestal-glow" style={{ margin: '-15px' }}></div>
                        
                        {/* Spinning ring */}
                        <div className="absolute inset-0 rounded-full spin-slow" style={{ margin: '-8px', border: '2px dashed rgba(167, 139, 250, 0.3)' }}></div>
                        
                        {/* Main pedestal */}
                        <div className={`w-56 h-56 rounded-full glass-strong flex items-center justify-center float-anim relative overflow-hidden ${isHatching ? 'hatch-shake' : ''}`}>
                            {/* Inner gradient */}
                            <div className={`absolute inset-0 rounded-full bg-gradient-to-br ${currentCreature.bgGradient} opacity-50`}></div>
                            
                            {/* Creature Image */}
                            {currentCreature.image ? (
                                <img 
                                    src={currentCreature.image} 
                                    alt={currentCreature.name}
                                    className={`w-40 h-40 object-contain relative z-10 drop-shadow-2xl ${showReveal ? 'reveal-anim' : ''} ${!isHatching ? 'spin-slow' : ''}`}
                                    style={{ animationDuration: '20s' }}
                                />
                            ) : (
                                <div className={`w-40 h-40 rounded-full flex items-center justify-center relative z-10 ${showReveal ? 'reveal-anim' : ''}`}>
                                    <div className="text-center">
                                        <p className="text-4xl">❓</p>
                                        <p className="text-xs text-purple-300 mt-2">{currentCreature.name}</p>
                                        <p className="text-[10px] text-purple-400">(Coming Soon)</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Hatch button / Info */}
                    <div className="text-center mt-2">
                        {energy >= 5 ? (
                            <div className="glass rounded-xl px-6 py-2.5">
                                <p className="text-white/80 text-xs font-inter">Tap pedestal to hatch!</p>
                                <p className="text-purple-200 text-[10px] mt-0.5">Costs 5 ⚡ energy</p>
                            </div>
                        ) : (
                            <div className="glass rounded-xl px-6 py-2.5">
                                <p className="text-red-300 text-xs font-inter">Not enough energy!</p>
                                <p className="text-purple-200 text-[10px] mt-0.5">Wait for energy to recharge</p>
                            </div>
                        )}
                    </div>

                    {/* Rarity chances info */}
                    <div className="glass rounded-xl px-4 py-2 mt-1">
                        <div className="flex items-center gap-3 text-[10px]">
                            <span className="text-green-300">Common 70%</span>
                            <span className="text-blue-300">Rare 18%</span>
                            <span className="text-purple-300">Epic 10%</span>
                            <span className="text-yellow-300">Legend 2%</span>
                        </div>
                    </div>
                </div>
            );
        }

        // ============ TASKS SCREEN ============
        function TasksScreen({ coins, setCoins }) {
            const [tasks] = useState([
                { id: 1, name: 'Watch Ad Video', reward: 50, icon: '🎬', completed: false },
                { id: 2, name: 'Daily Check-in', reward: 30, icon: '📅', completed: true },
                { id: 3, name: 'Invite a Friend', reward: 100, icon: '👥', completed: false },
                { id: 4, name: 'Collect 5 Creatures', reward: 200, icon: '🎯', completed: false },
            ]);

            return (
                <div className="w-full h-full overflow-y-auto no-scrollbar pb-24 pt-2 px-1">
                    <h2 className="text-white font-poppins font-bold text-lg mb-3 text-center">💰 Tasks</h2>
                    <div className="space-y-3">
                        {tasks.map(task => (
                            <div key={task.id} className="glass-strong rounded-2xl p-4 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500/30 to-blue-500/30 flex items-center justify-center text-xl">
                                        {task.icon}
                                    </div>
                                    <div>
                                        <p className="text-white text-sm font-medium">{task.name}</p>
                                        <p className="text-purple-300 text-xs">+{task.reward} 🪙</p>
                                    </div>
                                </div>
                                <button 
                                    className={`px-4 py-1.5 rounded-xl text-xs font-semibold ${
                                        task.completed 
                                            ? 'bg-green-500/20 text-green-300 border border-green-500/30' 
                                            : 'bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-lg'
                                    }`}
                                    disabled={task.completed}
                                >
                                    {task.completed ? '✓ Done' : 'Claim'}
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ============ COLLECTION SCREEN ============
        function CollectionScreen({ collection }) {
            const uniqueCreatures = collection.reduce((acc, c) => {
                if (!acc.find(x => x.id === c.id)) acc.push(c);
                return acc;
            }, []);

            return (
                <div className="w-full h-full overflow-y-auto no-scrollbar pb-24 pt-2 px-1">
                    <h2 className="text-white font-poppins font-bold text-lg mb-3 text-center">📖 Collection</h2>
                    {collection.length === 0 ? (
                        <div className="glass-strong rounded-2xl p-8 text-center">
                            <p className="text-4xl mb-3">🥚</p>
                            <p className="text-white/70 text-sm">No creatures yet!</p>
                            <p className="text-purple-300 text-xs mt-1">Tap the pedestal to hatch eggs</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 gap-3">
                            {uniqueCreatures.map((creature, i) => (
                                <div key={i} className="glass-strong rounded-2xl p-3 text-center">
                                    {creature.image ? (
                                        <img src={creature.image} alt={creature.name} className="w-20 h-20 mx-auto object-contain" />
                                    ) : (
                                        <div className="w-20 h-20 mx-auto flex items-center justify-center text-3xl">❓</div>
                                    )}
                                    <p className="text-white text-xs font-semibold mt-2">{creature.name}</p>
                                    <span className={`text-[10px] px-2 py-0.5 rounded-full inline-block mt-1 ${
                                        creature.rarity === 'Legendary' ? 'bg-yellow-400/20 text-yellow-300' :
                                        creature.rarity === 'Epic' ? 'bg-purple-400/20 text-purple-300' :
                                        creature.rarity === 'Rare' ? 'bg-blue-400/20 text-blue-300' :
                                        'bg-green-400/20 text-green-300'
                                    }`}>
                                        {creature.rarity}
                                    </span>
                                    <p className="text-purple-300 text-[10px] mt-1">
                                        x{collection.filter(c => c.id === creature.id).length}
                                    </p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ============ WALLET SCREEN ============
        function WalletScreen({ coins }) {
            return (
                <div className="w-full h-full overflow-y-auto no-scrollbar pb-24 pt-2 px-1">
                    <h2 className="text-white font-poppins font-bold text-lg mb-3 text-center">💳 Wallet</h2>
                    
                    {/* Balance Card */}
                    <div className="glass-strong rounded-2xl p-5 text-center mb-4">
                        <p className="text-purple-300 text-xs">Available Balance</p>
                        <p className="text-3xl font-bold text-white font-poppins mt-1">🪙 {coins.toLocaleString()}</p>
                        <p className="text-purple-300 text-xs mt-1">≈ ${(coins * 0.001).toFixed(2)} USD</p>
                    </div>

                    {/* Actions */}
                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <button className="glass-strong rounded-2xl p-4 text-center active:scale-95 transition-transform">
                            <p className="text-2xl mb-1">📤</p>
                            <p className="text-white text-xs font-medium">Withdraw</p>
                        </button>
                        <button className="glass-strong rounded-2xl p-4 text-center active:scale-95 transition-transform">
                            <p className="text-2xl mb-1">🎁</p>
                            <p className="text-white text-xs font-medium">Gift</p>
                        </button>
                    </div>

                    {/* Transaction History */}
                    <div className="glass-strong rounded-2xl p-4">
                        <p className="text-white text-sm font-semibold mb-3">Recent Activity</p>
                        <div className="space-y-2">
                            <div className="flex items-center justify-between py-2 border-b border-white/10">
                                <div className="flex items-center gap-2">
                                    <span className="text-green-400 text-sm">+10</span>
                                    <span className="text-white/70 text-xs">Hatched Common Slime</span>
                                </div>
                                <span className="text-purple-300 text-[10px]">Just now</span>
                            </div>
                            <div className="flex items-center justify-between py-2 border-b border-white/10">
                                <div className="flex items-center gap-2">
                                    <span className="text-green-400 text-sm">+30</span>
                                    <span className="text-white/70 text-xs">Daily Check-in</span>
                                </div>
                                <span className="text-purple-300 text-[10px]">2h ago</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============ BOTTOM NAVIGATION ============
        function BottomNav({ activeTab, setActiveTab }) {
            const tabs = [
                { id: 'home', label: 'Home', icon: '🏠' },
                { id: 'tasks', label: 'Tasks', icon: '💰' },
                { id: 'collection', label: 'Collection', icon: '📖' },
                { id: 'wallet', label: 'Wallet', icon: '💳' },
            ];

            return (
                <div className="relative z-10 px-4 pb-4 pt-2">
                    <div className="glass-strong rounded-2xl px-2 py-2 flex items-center justify-around">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-0.5 px-4 py-2 rounded-xl transition-all duration-300 ${
                                    activeTab === tab.id ? 'nav-active scale-105' : 'hover:bg-white/10'
                                }`}
                            >
                                <span className="text-lg">{tab.icon}</span>
                                <span className={`text-[10px] font-medium ${activeTab === tab.id ? 'text-white' : 'text-purple-300'}`}>
                                    {tab.label}
                                </span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // ============ RENDER ============
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
